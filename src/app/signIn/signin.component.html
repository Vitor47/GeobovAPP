<ActionBar title="GeoBov" class="action-bar"></ActionBar>

<GridLayout [formGroup]="form" backgroundColor="#19336c" class="container" rows="*,auto,*">
  <StackLayout row="1" class="form">
    <Image class="brand-logo" src="~/assets/geobov-logo.png" stretch="aspectFit"></Image>
    <Label class="brand-subtitle" text="Monitoramento de gado"></Label>
    <label>E-mail: </label>
    <TextField type="email" formControlName="email" keyboardType="email" autocorrect="false"
      autocapitalizationType="none" />
    @if(email.invalid && email.touched) {
    <Label style="color: red;">E-mail inválido</Label>
    }

    <label for="password">Senha: </label>
    <TextField id="password" type="password" secure="true" formControlName="password" />
    @if(password.invalid && password.touched) {
    <Label style="color: red;">Senha inválida</Label>
    }

    @if(isLogin()){
    <ActivityIndicator busy="true"></ActivityIndicator>
    }

    <Button text="Entrar" (tap)="onLogin()" class="btn btn-primary"></Button>
  </StackLayout>
</GridLayout>
